[package]
name = "schisaciaccole"
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
env_logger = "0.11.10"
getrandom = "0.4.3"
i-slint-core = "1.18.1"
keyring-core = "1.0.1"
log = "0.4.32"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
rodio = "0.22.2"
schisaciaccole-core = { path = "../core" }
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
slint = "1.18.1"
thiserror = "2.0.21"
url = "2.5.8"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = "1.0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", default-features = false, features = ["crypto-rust"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"

[build-dependencies]
slint-build = "1.18.1"

[package.metadata.bundle]
name = "Schisaciaccole"
identifier = "com.openmove.schisaciaccole"
icon = ["assets/icon_256.png", "assets/icon_512.png", "assets/icon_128.png"]
resources = ["assets/level_up_no_copyright.mp3"]
category = "Utility"
deb_depends = ["libasound2", "libfontconfig1", "libxkbcommon0", "libxcb-shape0", "libxcb-xfixes0"]
short_description = "Countdown timer for time-boxed Scrum ceremonies"
long_description = """
Pick the wall-clock time your time-boxed Scrum ceremony must end and the timer
counts down precisely to that moment, regardless of when the meeting started.
"""
