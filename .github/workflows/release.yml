name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Read version from Cargo.toml
        id: get_version
        # The version is inherited from [workspace.package]; ask cargo for the
        # resolved version of the app package instead of grepping manifests.
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -er '.packages[] | select(.name == "schisaciaccole") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check tag matches Cargo.toml version
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="${{ steps.get_version.outputs.version }}"
          if [ "$tag_version" != "$manifest_version" ]; then
            echo "::error::Tag v$tag_version does not match Cargo.toml version $manifest_version"
            exit 1
          fi

  deb:
    needs: version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libasound2-dev libfontconfig1-dev libxkbcommon-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install --locked cargo-bundle --version 0.12.0

      - name: Build .deb
        # Run from the app crate: invoked from the workspace root with
        # `-p schisaciaccole`, cargo-bundle resolves the icon/resource paths
        # against the cwd and silently drops them. The bundle still lands in the
        # workspace target/ dir.
        working-directory: crates/app
        run: cargo bundle --release --format deb

      - name: Check bundle content and name it after its target OS
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          src=$(find target -path '*/bundle/deb/*.deb' -print -quit)
          if [ -z "$src" ]; then
            echo "::error::no .deb found under target/"
            exit 1
          fi
          echo "bundled deb: $src"
          dpkg-deb -c "$src"
          contents=$(dpkg-deb -c "$src" | awk '{print $NF}' | sed 's|^\./||')
          for f in usr/bin/schisaciaccole \
                   usr/lib/schisaciaccole/assets/level_up_no_copyright.mp3 \
                   usr/share/icons/hicolor/256x256/apps/schisaciaccole.png; do
            if ! grep -qxF "$f" <<<"$contents"; then
              echo "::error::$f missing from $src"
              exit 1
            fi
          done
          mkdir -p dist
          mv "$src" "dist/schisaciaccole-${ver}-ubuntu-amd64.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/*-ubuntu-amd64.deb
          if-no-files-found: error

  arch:
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build tools and runtime dependencies
        # `rust` satisfies makedepends=('cargo'); alsa-lib/fontconfig/libxkbcommon
        # satisfy depends=() so `makepkg -f` (no -s) doesn't refuse to build.
        run: pacman -Syu --noconfirm --needed rust git sudo alsa-lib fontconfig libxkbcommon

      - uses: actions/checkout@v4

      - name: Pin pkgver to release version
        run: sed -i "s/^pkgver=.*/pkgver=${{ needs.version.outputs.version }}/" packaging/arch/PKGBUILD

      - name: Build package with makepkg
        run: |
          useradd -m builder
          chown -R builder: "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg -f

      - name: Name the artifact after its target OS
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          cd packaging/arch
          src=$(find . -maxdepth 1 -name '*.pkg.tar.zst' -print -quit)
          mv "$src" "schisaciaccole-${ver}-arch-x86_64.pkg.tar.zst"

      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: packaging/arch/*-arch-x86_64.pkg.tar.zst
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-bundle
        run: cargo install --locked cargo-bundle --version 0.12.0

      - name: Build .app
        # Run from the app crate so the icon/resource paths resolve (see the
        # deb job); the bundle lands in the workspace target/ dir.
        working-directory: crates/app
        run: cargo bundle --release --format osx

      - name: Package .zip and .dmg
        run: |
          set -euo pipefail
          ver="${{ needs.version.outputs.version }}"
          # cargo-bundle's osx output dir has moved between versions; locate the
          # .app instead of hard-coding target/release/bundle/osx/.
          app=$(find target/release -maxdepth 4 -name '*.app' -type d -print -quit)
          if [ -z "$app" ]; then
            echo "::error::no .app found under target/release"
            find target/release -maxdepth 4 -name 'bundle*' -o -name '*.app' || true
            exit 1
          fi
          echo "bundled app: $app"
          sound="$app/Contents/Resources/assets/level_up_no_copyright.mp3"
          if [ ! -f "$sound" ]; then
            echo "::error::$sound missing from the bundle"
            find "$app" || true
            exit 1
          fi
          ditto -c -k --keepParent "$app" "schisaciaccole-${ver}-macos-arm64.zip"
          hdiutil create -volname Schisaciaccole -srcfolder "$app" -ov -format UDZO "schisaciaccole-${ver}-macos-arm64.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            schisaciaccole-*-macos-arm64.zip
            schisaciaccole-*-macos-arm64.dmg
          if-no-files-found: error

  release:
    needs: [deb, arch, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > release-notes.md <<'EOF'
          The macOS build is unsigned and unnotarized. On first launch, either
          right-click the app and choose "Open", or clear the quarantine flag:

              xattr -dr com.apple.quarantine /Applications/Schisaciaccole.app
          EOF
          gh release create "$GITHUB_REF_NAME" \
            --title "Schisaciaccole $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --generate-notes \
            ./dist/*
