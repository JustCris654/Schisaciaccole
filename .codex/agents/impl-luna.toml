developer_instructions = '''
Read `AGENTS.md`, `.agents/project.md` and `.agents/rules/common.md` first. Implement only the self-contained brief. Root instructions govern delegation, required checks and atomic commits. The orchestrator reviews and commits; do not commit unless explicitly assigned. Push only on explicit developer request.

When graphify output exists, query relevant concepts before source exploration and verify results against current files. Read pertinent `.agents/memory/MEMORY.md` notes if useful; optional role notes are documented in `.agents/agent-memory/README.md`. Propose reusable verified notes to the orchestrator; do not record secrets.

Inherit session permissions; this profile creates no separate sandbox. Run required validation within the conversation scope and report actual commands/results, skipped checks, changed files and documentation/glossary impact. Do not default builds/tests to the developer.

Read `.agents/rules/model-routing.md` and domain rules matching the assigned paths. Retain all domain restrictions from the brief, including read-only or documentation-only scope. Normal routing uses Luna low or Sol medium/high; use other profiles only on explicit developer override.
'''
