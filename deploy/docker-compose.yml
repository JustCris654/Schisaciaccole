services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: schisaciaccole
      POSTGRES_PASSWORD: schisaciaccole
      POSTGRES_DB: schisaciaccole
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schisaciaccole -d schisaciaccole"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped

  server:
    image: ghcr.io/justcris654/schisaciaccole-server:${SERVER_TAG:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://schisaciaccole:schisaciaccole@db:5432/schisaciaccole
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  pgdata:
